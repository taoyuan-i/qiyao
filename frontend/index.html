<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>七曜</title>
<style>
  :root{
    --ground:#14161C; --surface:#1E2129; --line:#2A2F3A;
    --text:#E8E4DC; --muted:#7C8296; --accent:#6C8EBF;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--ground);color:var(--text);
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    font-size:16px;line-height:1.7}
  #app{display:flex;flex-direction:column;height:100vh;max-width:640px;margin:0 auto}
  header{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
  .avatar{width:30px;height:30px;border-radius:50%;background:var(--accent);
    display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--ground);
    background-size:cover;background-position:center;flex:none}
  #title{font-size:20px;letter-spacing:.12em;color:var(--accent)}
  select{margin-left:auto;background:var(--surface);color:var(--text);
    border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:inherit}
  #cfg{display:flex;gap:8px;align-items:center;padding:9px 18px;
    border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
  #cfg input{flex:1;background:var(--surface);color:var(--text);
    border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:inherit;font-size:13px}
  #cfg.hidden{display:none}
  #stream{flex:1;overflow-y:auto;padding:20px 18px;display:flex;flex-direction:column;gap:18px}
  .row{display:flex;gap:10px;align-items:flex-start}
  .row.me{flex-direction:row-reverse}
  .bubble{white-space:pre-wrap;word-break:break-word}
  .row.them .bubble{border-left:2px solid var(--accent);padding-left:12px}
  .row.me .bubble{background:var(--surface);border-radius:14px 14px 3px 14px;padding:9px 14px;max-width:80%}
  .note{align-self:center;font-size:13px;color:var(--muted);text-align:center;
    background:var(--surface);padding:6px 12px;border-radius:8px}
  form{display:flex;gap:10px;padding:12px 18px;border-top:1px solid var(--line)}
  textarea{flex:1;resize:none;background:var(--surface);color:var(--text);
    border:1px solid transparent;border-radius:12px;padding:11px 14px;font:inherit;max-height:120px}
  textarea:focus{outline:none;border-color:var(--accent)}
  button{flex:none;width:44px;height:44px;border-radius:50%;border:0;cursor:pointer;
    background:var(--accent);color:var(--ground);font-size:18px}
  button:disabled{opacity:.4;cursor:default}
</style>
</head>
<body>
<div id="app">
  <header>
    <span class="avatar" id="avatar">曜</span>
    <span id="title">七曜</span>
    <select id="persona">
      <option value="tanlang">贪狼</option>
      <option value="jumen">巨门</option>
      <option value="lucun">禄存</option>
      <option value="wenqu">文曲</option>
      <option value="lianzhen">廉贞</option>
      <option value="wuqu">武曲</option>
      <option value="pojun">破军</option>
    </select>
  </header>
  <div id="cfg" class="hidden">
    密钥 <input id="key" placeholder="SERVICE_KEY（留空亦可）" autocomplete="off">
  </div>
  <main id="stream"></main>
  <form id="composer">
    <textarea id="input" rows="1" placeholder="说点什么"></textarea>
    <button id="send" type="submit">↑</button>
  </form>
</div>

<script>
// 每个星曜的展示信息：头像用文字占位，日后把 img 换成图片地址即可。
// 想用图片头像：把 img 设为 "/avatars/wenqu.png"（图片放 frontend/avatars/ 下）
var PERSONAS = {
  tanlang:  { name:"贪狼", glyph:"贪", img:"", accent:"#C98A5E" },
  jumen:    { name:"巨门", glyph:"巨", img:"", accent:"#5E7C8A" },
  lucun:    { name:"禄存", glyph:"禄", img:"", accent:"#8A9B6E" },
  wenqu:    { name:"文曲", glyph:"文", img:"", accent:"#6C8EBF" },
  lianzhen: { name:"廉贞", glyph:"廉", img:"", accent:"#9B5E6E" },
  wuqu:     { name:"武曲", glyph:"武", img:"", accent:"#6E7B8A" },
  pojun:    { name:"破军", glyph:"破", img:"", accent:"#B5806B" }
};

var streamEl = document.getElementById("stream");
var inputEl  = document.getElementById("input");
var keyEl    = document.getElementById("key");
var cfgEl    = document.getElementById("cfg");
var sendBtn  = document.getElementById("send");
var personaEl= document.getElementById("persona");
var avatarEl = document.getElementById("avatar");
var titleEl  = document.getElementById("title");
var msgs  = [];
var busy = false;

function currentPersona(){ return PERSONAS[personaEl.value] || PERSONAS.wenqu; }

function applyPersona(){
  var p = currentPersona();
  document.documentElement.style.setProperty("--accent", p.accent);
  titleEl.textContent = p.name;
  if (p.img){
    avatarEl.textContent = "";
    avatarEl.style.backgroundImage = "url('" + p.img + "')";
  } else {
    avatarEl.style.backgroundImage = "";
    avatarEl.textContent = p.glyph;
  }
}

function addNote(text){
  var el = document.createElement("div");
  el.className = "note"; el.textContent = text;
  streamEl.appendChild(el); streamEl.scrollTop = streamEl.scrollHeight;
}

function addRow(kind){
  var p = currentPersona();
  var row = document.createElement("div");
  row.className = "row " + kind;
  if (kind === "them"){
    var av = document.createElement("span");
    av.className = "avatar";
    if (p.img){ av.style.backgroundImage = "url('" + p.img + "')"; }
    else { av.textContent = p.glyph; }
    row.appendChild(av);
  }
  var b = document.createElement("div");
  b.className = "bubble";
  row.appendChild(b);
  streamEl.appendChild(row);
  streamEl.scrollTop = streamEl.scrollHeight;
  return b;
}

personaEl.onchange = function(){
  applyPersona();
  msgs = [];
  streamEl.innerHTML = "";
  addNote("已切换到「" + currentPersona().name + "」，对话已重置");
};

// 回车发送（Shift+回车换行）
inputEl.addEventListener("keydown", function(e){
  if (e.key === "Enter" && !e.shiftKey){
    e.preventDefault();
    document.getElementById("composer").requestSubmit();
  }
});
inputEl.addEventListener("input", function(){
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px";
});

document.getElementById("composer").onsubmit = function(e){
  e.preventDefault();
  send();
};

async function send(){
  if (busy) return;
  var text = inputEl.value.trim();
  var key  = keyEl.value.trim();   // 可留空，后端不强制校验时也能用
  if (!text) return;

  inputEl.value = "";
  inputEl.style.height = "auto";
  addRow("me").textContent = text;
  msgs.push({ role:"user", content:text });

  busy = true; sendBtn.disabled = true;
  var bubble = addRow("them"); bubble.textContent = "…";
  var answer = "";

  try {
    var headers = { "Content-Type":"application/json", "X-Persona":personaEl.value };
    if (key) headers["Authorization"] = "Bearer " + key;

    var resp = await fetch("/v1/chat/completions", {
      method:"POST", headers:headers,
      body: JSON.stringify({ stream:true, messages:msgs })
    });
    if (!resp.ok){
      var errText = await resp.text();
      throw new Error("HTTP " + resp.status + " " + errText.slice(0,150));
    }

    var reader = resp.body.getReader();
    var decoder = new TextDecoder("utf-8");
    var buf = "";
    while (true){
      var rr = await reader.read();
      if (rr.done) break;
      buf += decoder.decode(rr.value, { stream:true });
      var lines = buf.split("\n");
      buf = lines.pop();
      for (var i=0;i<lines.length;i++){
        var line = lines[i];
        if (line.indexOf("data: ") !== 0) continue;
        var payload = line.slice(6).trim();
        if (payload === "[DONE]") continue;
        try {
          var pkt = JSON.parse(payload);
          if (pkt.error) throw new Error(pkt.error.message || "upstream error");
          var d = pkt.choices && pkt.choices[0] && pkt.choices[0].delta;
          if (d && d.content){
            answer += d.content;
            bubble.textContent = answer;
            streamEl.scrollTop = streamEl.scrollHeight;
          }
        } catch(_){}
      }
    }

    if (answer){ msgs.push({ role:"assistant", content:answer }); }
    else { bubble.textContent = "(没有收到回复，检查服务器日志)"; }
  } catch(err){
    bubble.parentNode.remove();
    addNote("出错了：" + err.message);
    msgs.pop();
  } finally {
    busy = false; sendBtn.disabled = false; inputEl.focus();
  }
}

applyPersona();
</script>
</body>
</html>
