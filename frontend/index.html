<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>七曜 · 调试</title>
<style>
  :root{
    --ground:#14161C; --surface:#1E2129; --line:#2A2F3A;
    --text:#E8E4DC; --muted:#7C8296; --accent:#6C8EBF;
    --serif:"Songti SC","Noto Serif SC",Georgia,serif;
    --sans:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--ground);
    color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.75}
  #app{display:flex;flex-direction:column;height:100dvh;max-width:640px;margin:0 auto}

  header{display:flex;align-items:center;gap:12px;padding:14px 20px;
    border-bottom:1px solid var(--line);flex:none}
  #title{font-family:var(--serif);font-size:20px;letter-spacing:.15em;
    color:var(--accent);transition:color .5s}
  select{margin-left:auto;background:var(--surface);color:var(--text);
    border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:inherit}

  #cfg{padding:10px 20px;border-bottom:1px solid var(--line);flex:none;
    display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
  #cfg input{flex:1;background:var(--surface);color:var(--text);
    border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:inherit;font-size:13px}

  #stream{flex:1;overflow-y:auto;padding:24px 20px 8px;
    display:flex;flex-direction:column;gap:20px;overscroll-behavior:contain}
  .turn.them{border-left:1px solid var(--accent);padding-left:15px;
    white-space:pre-wrap;word-break:break-word;transition:border-color .5s}
  .turn.me{align-self:flex-end;max-width:82%;background:var(--surface);
    border-radius:14px 14px 3px 14px;padding:9px 15px;white-space:pre-wrap;
    word-break:break-word;color:#CFCEC8}
  .turn.note{align-self:center;font-size:12px;color:var(--muted);text-align:center}
  .caret::after{content:"";display:inline-block;width:7px;height:1.05em;
    margin-left:3px;background:var(--accent);vertical-align:text-bottom;
    animation:blink 1.1s steps(2,start) infinite}
  @keyframes blink{50%{opacity:0}}

  form{flex:none;display:flex;align-items:flex-end;gap:10px;
    padding:12px 20px calc(12px + env(safe-area-inset-bottom));
    border-top:1px solid var(--line)}
  textarea{flex:1;resize:none;max-height:132px;background:var(--surface);
    color:var(--text);border:1px solid transparent;border-radius:12px;
    padding:11px 14px;font:inherit;line-height:1.6}
  textarea:focus{outline:none;border-color:var(--accent)}
  #send{flex:none;width:42px;height:42px;border-radius:50%;border:0;cursor:pointer;
    background:var(--accent);color:var(--ground);font-size:17px;transition:opacity .2s}
  #send:disabled{opacity:.35}
</style>
</head>
<body>
<div id="app">
  <header>
    <span id="title">七曜</span>
    <select id="persona"></select>
  </header>
  <div id="cfg">
    密钥 <input id="key" placeholder="你的 SERVICE_KEY" autocomplete="off">
  </div>
  <main id="stream"></main>
  <form id="composer">
    <textarea id="input" rows="1" placeholder="说点什么" autocomplete="off"></textarea>
    <button id="send" type="submit">↑</button>
  </form>
</div>

<script>
// 这个调试页和后端同源部署,接口就在同一个地址下,无需填 baseURL。
const $ = id => document.getElementById(id);
const stream=$("stream"), input=$("input"), send=$("send"), keyBox=$("key");

// 记住上次填的密钥,省得每次输
keyBox.value = "";
try { keyBox.value = window.name || ""; } catch(e){}
keyBox.addEventListener("input", ()=>{ try{ window.name = keyBox.value; }catch(e){} });

// 星曜列表:从后端 /v1/models 拿不到人设详情,这里直接内置已知星曜。
// 加了新星曜就在这里加一项(id 要和 personas/*.yaml 的 id 一致)。
const PERSONAS = [
  { id:"wenqu", name:"文曲", accent:"#6C8EBF" },
  { id:"pojun", name:"破军", accent:"#B5806B" },
];
let current = PERSONAS[0];
let history = [];   // OpenAI 格式的多轮消息

function renderPersonaSelect(){
  const sel=$("persona");
  PERSONAS.forEach(p=>{
    const o=document.createElement("option");
    o.value=p.id; o.textContent=p.name; sel.appendChild(o);
  });
  sel.onchange=()=>{
    current = PERSONAS.find(p=>p.id===sel.value);
    document.documentElement.style.setProperty("--accent",current.accent);
    $("title").textContent = current.name;
    history = [];
    stream.innerHTML="";
    addTurn("note","已切换到「"+current.name+"」，对话已重置");
  };
}

function addTurn(kind,text=""){
  const el=document.createElement("div");
  el.className="turn "+kind; el.textContent=text;
  stream.appendChild(el); stream.scrollTop=stream.scrollHeight;
  return el;
}

input.addEventListener("input",()=>{
  input.style.height="auto";
  input.style.height=Math.min(input.scrollHeight,132)+"px";
});
input.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey&&!matchMedia("(pointer:coarse)").matches){
    e.preventDefault(); $("composer").requestSubmit();
  }
});

$("composer").onsubmit=async e=>{
  e.preventDefault();
  const text=input.value.trim();
  const key=keyBox.value.trim();
  if(!text) return;
  if(!key){ addTurn("note","先在上方填入 SERVICE_KEY"); return; }

  input.value=""; input.style.height="auto";
  addTurn("me",text);
  history.push({role:"user",content:text});

  send.disabled=true;
  const bubble=addTurn("them"); bubble.classList.add("caret");

  try{
    // 关键:persona 通过 model 字段传给后端；后端按 DEFAULT_PERSONA 兜底，
    // 但调试页想切换星曜，这里用一个自定义头 X-Persona 传。
    const resp=await fetch("/v1/chat/completions",{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization":"Bearer "+key,
        "X-Persona":current.id
      },
      body:JSON.stringify({stream:true,messages:history})
    });
    if(!resp.ok){ throw new Error("服务返回 "+resp.status); }

    const reader=resp.body.pipeThrough(new TextDecoderStream()).getReader();
    let buf="", answer="";
    while(true){
      const {value,done}=await reader.read();
      if(done) break;
      buf+=value;
      const lines=buf.split("\n"); buf=lines.pop();
      for(const line of lines){
        if(!line.startsWith("data: ")) continue;
        const body=line.slice(6);
        if(body==="[DONE]") continue;
        let pkt; try{ pkt=JSON.parse(body); }catch(_){ continue; }
        if(pkt.error){ throw new Error(pkt.error.message||"上游错误"); }
        const delta=pkt.choices?.[0]?.delta?.content;
        if(delta){ answer+=delta; bubble.textContent=answer; stream.scrollTop=stream.scrollHeight; }
      }
    }
    if(answer){ history.push({role:"assistant",content:answer}); }
    else{ bubble.textContent="(没有回应，检查密钥或服务日志)"; }
  }catch(err){
    bubble.remove();
    addTurn("note","出错了 —— "+err.message);
    history.pop();  // 回滚这轮用户消息，避免污染上下文
  }finally{
    bubble.classList.remove("caret");
    send.disabled=false; input.focus();
  }
};

renderPersonaSelect();
document.documentElement.style.setProperty("--accent",current.accent);
addTurn("note","填入 SERVICE_KEY 后即可和星曜对话");
